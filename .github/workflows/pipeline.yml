name: DevOps CI Pipeline


on: [push]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      
      - name: Checkout Code
        uses: actions/checkout@v4

      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

    
      - name: Execute Tests
        run: python test_app.py
